<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Rhino Tires USA">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eaee"/>
      <stop offset="0.5" stop-color="#b9bec7"/>
      <stop offset="1" stop-color="#9aa0ab"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc61a"/>
      <stop offset="1" stop-color="#e59d00"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8087"/>
      <stop offset="0.55" stop-color="#5d6066"/>
      <stop offset="1" stop-color="#43464b"/>
    </linearGradient>
    <linearGradient id="goldtxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7bd16"/>
      <stop offset="1" stop-color="#d99400"/>
    </linearGradient>
  </defs>

