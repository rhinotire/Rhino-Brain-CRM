    <path fill="#151515" d="
      M48 156
      L47 108
      C48 98 51 90 56 84
      C57 76 58 68 60 63
      C61 61 63 61 64 63
      C65 68 66 74 68 79
      C74 77 79 76 84 77
      C92 80 100 83 108 86
      C109 80 111 73 114 69
      C115 67 117 67 118 69
      C118 73 118 78 119 84
      C121 85 123 86 125 88
      C126 76 128 58 131 46
      C133 43 136 44 137 47
      C139 62 141 78 144 92
      C148 96 151 101 152 106
      C152 110 150 113 147 115
      C141 117 135 118 130 119
      C129 122 128 124 126 125
      C124 128 122 130 118 131
      C110 136 102 140 94 143
      C82 148 68 153 58 156
      Z"/>
    <circle cx="92" cy="98" r="4" fill="url(#gold)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900">
    <text x="196" y="108" font-size="86" fill="url(#steel)" stroke="#ffffff" stroke-width="8" paint-order="stroke" letter-spacing="2">RHINO</text>
    <text x="238" y="168" font-size="52" fill="url(#goldtxt)" stroke="#ffffff" stroke-width="6" paint-order="stroke" letter-spacing="4">TIRES USA</text>
