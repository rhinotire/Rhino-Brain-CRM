packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency lifecycle scripts unless whitelisted.
# @prisma/client is deliberately NOT whitelisted: its postinstall only writes
# placeholder stubs and can clobber the real client generated by the
# workspace postinstall hooks (packages/database + apps/rhino-brain).
onlyBuiltDependencies:
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "unrs-resolver"
